name: Node y Bun verificados
description: >
  La imagen de arc-k8s no trae node ni bun. Instala ambos con checksum
  (fork-pr-checks y upstream-sync comparten esto; ver skill ci-runners-arc).
  DGX-516: detecta la arch del runner (x64 y arm64) para servir también al
  matrix arm64 de release.yml.
inputs:
  bun:
    description: "Instalar Bun ('false' para jobs que solo necesitan node)"
    default: 'true'
runs:
  using: composite
  steps:
    - name: Instalar Node verificado
      shell: bash
      run: |
        set -euo pipefail
        version=22.23.2
        case "$(uname -m)" in
          x86_64) node_arch=linux-x64;   expected=b294a556e639d64338823920e5866c21c02741742d2e1529ee1a225c1ec9252a ;;
          aarch64) node_arch=linux-arm64; expected=013b59cfd2819703a6f4a14ab891fc46fc2a4e3f5bcd92de3fb4929b43e35b30 ;;
          *) echo "::error::arquitectura de runner no soportada: $(uname -m)"; exit 1 ;;
        esac
        archive="$RUNNER_TEMP/node-${version}-${node_arch}.tar.gz"
        curl --retry 3 --retry-all-errors -fsSL \
          "https://nodejs.org/dist/v${version}/node-v${version}-${node_arch}.tar.gz" -o "$archive"
        echo "${expected}  ${archive}" | sha256sum --check --strict
        tar xzf "$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/node-v${version}-${node_arch}/bin" >> "$GITHUB_PATH"

    - name: Instalar Bun verificado
      if: inputs.bun == 'true'
      shell: bash
      run: |
        set -euo pipefail
        version="$(python3 -c 'import json;pm=json.load(open("package.json")).get("packageManager","");print(pm.split("@",1)[1] if pm.startswith("bun@") else "")')"
        case "$(uname -m)" in
          x86_64) bun_arch=linux-x64;    expected=36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913 ;;
          aarch64) bun_arch=linux-aarch64; expected=54328bbc2d9c8e0c9f892c544d66c57a83b84139e34909e5ee81758f1ac8fda7 ;;
          *) echo "::error::arquitectura de runner no soportada: $(uname -m)"; exit 1 ;;
        esac
        case "$version/$bun_arch" in
          1.4.2/linux-x64|1.4.2/linux-aarch64) ;;
          *) echo "::error::packageManager pide bun '${version:-?}' y no hay checksum verificado en esta accion"; exit 1 ;;
        esac
        archive="$RUNNER_TEMP/bun-${bun_arch}.zip"
        curl --retry 3 --retry-all-errors -fsSL \
          "https://github.com/oven-sh/bun/releases/download/bun-v${version}/bun-${bun_arch}.zip" -o "$archive"
        echo "${expected}  ${archive}" | sha256sum --check --strict
        python3 -m zipfile -e "$archive" "$RUNNER_TEMP/bun/"
        chmod +x "$RUNNER_TEMP/bun/bun-${bun_arch}/bun"
        echo "$RUNNER_TEMP/bun/bun-${bun_arch}" >> "$GITHUB_PATH"
