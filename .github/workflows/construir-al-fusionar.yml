name: Construir al fusionar

# Cada fusion a la rama de deploy construye web + .app, pasa por el canario y,
# si aguanta la ventana, promociona. El pipeline entero vive en el repo de build
# (pocharlies-org/openchamber-build-pocharlies); aqui solo se le llama.
#
# POR QUE UN `uses:` Y NO UN DISPATCH
#
# Se probaron las dos alternativas el 03-09-2026 y ninguna sirve:
#
#   1. Una encuesta cada 15 min en el repo de build lanzando `gh workflow run`:
#      la imagen de arc-k8s no trae `gh` (run 33809467095, "command not found").
#   2. Aunque lo trajera, un dispatch hecho con el GITHUB_TOKEN NO crea una
#      ejecucion. GitHub lo bloquea para evitar workflows recursivos, asi que
#      habria devuelto 204 sin lanzar nada: un fallo mudo.
#
# `uses:` no es un evento sino una llamada dentro de la misma ejecucion, asi que
# no le aplica ninguna de las dos. Y de paso desaparece el retardo del cron: el
# build empieza con la fusion, no hasta 15 minutos despues.
#
# Requiere `access_level: organization` en el repo de build, ya puesto.

on:
  push:
    branches:
      - build/v1.22.0-metrics
  # Sin workflow_dispatch: GitHub solo lo ofrece si el fichero esta en la rama
  # POR DEFECTO (aqui `main`, que es el espejo de upstream y no lleva nuestros
  # parches), asi que declararlo daba un 404 al invocarlo y una promesa falsa a
  # quien leyera el fichero. El disparo por push si funciona desde la rama de
  # deploy, porque lee el workflow de la rama del propio push.
  #
  # Para lanzarlo a mano se usa el `workflow_dispatch` de build-todo en el repo
  # de build, que es donde vive el pipeline de verdad.

# Un reusable NO puede pedir mas permisos que su llamador: si aqui se declara
# de menos, la ejecucion entera sale `startup_failure` en dos segundos, sin log
# ni paso fallido, y parece un problema de red. Esto espeja lo que declara
# build-todo.
permissions:
  contents: read
  actions: read

concurrency:
  # Dos fusiones seguidas no deben construir a la vez, pero tampoco cancelarse:
  # la primera puede estar ya promocionando cuando llega la segunda.
  group: construir-al-fusionar
  cancel-in-progress: false

jobs:
  construir:
    uses: pocharlies-org/openchamber-build-pocharlies/.github/workflows/build-todo.yml@main
    with:
      ref: ${{ github.sha }}
      surfaces: ambos
      desplegar: true
    # inherit y no una lista explicita: si este repo no tiene los de Telegram,
    # llegan vacios y build-todo los declara opcionales a proposito. Se
    # construye y se despliega igual; solo se pierde el aviso.
    secrets: inherit
