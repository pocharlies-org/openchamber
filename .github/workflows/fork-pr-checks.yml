name: Fork — checks de PR

# Las PRs contra la rama acumulativa del fork no tenian ningun check: los
# workflows heredados de upstream disparan por comentario o por
# pull_request_target con condiciones de openchamber/openchamber, y la puerta
# completa (openchamber-build-pocharlies/build-web.yml) corre DESPUES de
# fusionar. Esto es la puerta previa: type-check, tests de ui (verdes al 100%
# en la puerta completa) y los tests de web que toca la PR.
#
# Web se limita a `vitest --changed`: la suite entera tiene fallos heredados de
# upstream que la puerta completa decide contra ci/fallos-conocidos-web.txt,
# y esa lista vive en el repo de build (privado, sin token desde aqui).

on:
  pull_request:
    branches: [build/v2.0.1-metrics]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: type-check + tests
    # Regla de la org (skill ci-runners-arc).
    runs-on: arc-k8s
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar Node verificado
        # La imagen de arc-k8s no trae node ni bun. Mismo metodo y checksum que
        # openchamber-build-pocharlies/build-web.yml.
        run: |
          set -euo pipefail
          version=22.23.2
          expected=b294a556e639d64338823920e5866c21c02741742d2e1529ee1a225c1ec9252a
          archive="$RUNNER_TEMP/node-${version}.tar.gz"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://nodejs.org/dist/v${version}/node-v${version}-linux-x64.tar.gz" -o "$archive"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v${version}-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Instalar Bun verificado
        # Version del packageManager; sin checksum conocido no se instala.
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;pm=json.load(open("package.json")).get("packageManager","");print(pm.split("@",1)[1] if pm.startswith("bun@") else "")')"
          case "$version" in
            1.4.2) expected=36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913 ;;
            *) echo "::error::packageManager pide bun '${version:-?}' y no hay checksum verificado en este workflow"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/bun.zip"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://github.com/oven-sh/bun/releases/download/bun-v${version}/bun-linux-x64.zip" -o "$archive"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          python3 -m zipfile -e "$archive" "$RUNNER_TEMP/bun/"
          chmod +x "$RUNNER_TEMP/bun/bun-linux-x64/bun"
          echo "$RUNNER_TEMP/bun/bun-linux-x64" >> "$GITHUB_PATH"

      - name: Dependencias
        run: bun install --frozen-lockfile

      - name: Type-check
        run: |
          set -euo pipefail
          bun run type-check:ui
          bun run type-check:web

      - name: Tests de ui
        run: bun run --cwd packages/ui test

      - name: Tests de web afectados por la PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/build/v2.0.1-metrics' }}
        working-directory: packages/web
        run: bun x vitest run --changed "$BASE_SHA" --passWithNoTests --retry=2 --testTimeout=60000 --hookTimeout=60000
