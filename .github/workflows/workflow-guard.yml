name: Guarda del fork (workflows + secretos)

# Puerta de PR del fork público (DGX-515): falla si reaparece un runner propio
# o hosted en `pull_request`, un workflow con target de PR, o un secreto sin
# `environment:`; y si gitleaks encuentra un secreto nuevo en el árbol o el
# historial publicado (falsos positivos conocidos: .gitleaks.toml).
#
# Vive en su propio workflow porque `fork-pr-checks.yml` aún no está en `main`
# (llega con la PR de la pila DGX-517): al fusionarse esa PR, mover el job
# `guarda` allí y borrar este fichero, para no duplicar la puerta.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guarda:
    name: check-workflow-guard + gitleaks
    # Regla de la org (skill ci-runners-arc): Linux genérico en ARC.
    runs-on: arc-k8s
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar Node verificado
        # La imagen de arc-k8s no trae node ni bun. Mismo método y checksum que
        # fork-pr-checks.yml (al unificar los dos workflows, extraer a composite).
        run: |
          set -euo pipefail
          version=22.23.2
          expected=b294a556e639d64338823920e5866c21c02741742d2e1529ee1a225c1ec9252a
          archive="$RUNNER_TEMP/node-${version}.tar.gz"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://nodejs.org/dist/v${version}/node-v${version}-linux-x64.tar.gz" -o "$archive"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v${version}-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Instalar Bun verificado
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;pm=json.load(open("package.json")).get("packageManager","");print(pm.split("@",1)[1] if pm.startswith("bun@") else "")')"
          case "$version" in
            1.4.2) expected=36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913 ;;
            *) echo "::error::packageManager pide bun '${version:-?}' y no hay checksum verificado en este workflow"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/bun.zip"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://github.com/oven-sh/bun/releases/download/bun-v${version}/bun-linux-x64.zip" -o "$archive"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          python3 -m zipfile -e "$archive" "$RUNNER_TEMP/bun/"
          chmod +x "$RUNNER_TEMP/bun/bun-linux-x64/bun"
          echo "$RUNNER_TEMP/bun/bun-linux-x64" >> "$GITHUB_PATH"

      - name: Dependencias
        run: bun install --frozen-lockfile

      - name: Guarda de workflows
        run: |
          set -euo pipefail
          node scripts/check-workflow-guard.mjs
          node --test scripts/check-workflow-guard.test.mjs

      - name: gitleaks (árbol e historial)
        # Binario oficial con checksum; la imagen de arc-k8s no lo trae.
        run: |
          set -euo pipefail
          version=8.30.1
          expected=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="$RUNNER_TEMP/gitleaks.tgz"
          curl --retry 3 --retry-all-errors -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o "$archive"
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --no-banner --redact
